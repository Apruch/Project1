<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WarungKu Internal — Operasional Warung</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/launchericon-192x192.png">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <div class="topbar-title" id="topbar-title">WarungKu Internal</div>
        <div class="topbar-sub" id="topbar-sub">—</div>
      </div>
      <button class="topbar-icon-btn" onclick="openMenu()" title="Menu">⋮</button>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="bnav">
    <div class="ni on" data-page="beranda">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Beranda
    </div>
    <div class="ni" data-page="bahan">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.72V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.72c.57-.38 1-.99 1-1.72V4c0-1.1-.9-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4h16v3z"/></svg>
      Bahan Baku
    </div>
    <div class="ni" data-page="mutasi">
      <svg viewBox="0 0 24 24"><path d="M9 3L5 6.99h3V14h2V6.99h3L9 3zm7 14.01V10h-2v7.01h-3L15 21l4-3.99h-3z"/></svg>
      Mutasi Stok
    </div>
    <div class="ni" data-page="keuangan">
      <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
      Keuangan
    </div>
  </div>

  <!-- Sheet / modal untuk form tambah & edit -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="if(event.target===this) closeSheet();">
    <div class="sheet" id="sheet-body" onclick="event.stopPropagation()"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  if(typeof appInit === 'function') appInit();
});
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

function openMenu(){
  var html = '<div class="sheet-title"><span>Menu</span><span class="sheet-close" onclick="closeSheet()">&times;</span></div>';
  html += '<button class="btn btn-outline" style="margin-bottom:10px;" onclick="eksporData()">⬇ Ekspor Data (Backup JSON)</button>';
  html += '<button class="btn btn-danger" onclick="resetData()">Reset Semua Data</button>';
  openSheet(html);
}
</script>
</body>
</html>
